<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #16324f;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 28px;
            font-weight: bold;
        }

        nav {
            background: #dbeafe;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 18px;
        }

        nav a {
            color: #16324f;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #2563eb;
        }

        .welcome {
            text-align: center;
            padding: 80px 20px;
            min-height: 350px;
        }

        .welcome h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .welcome p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .login-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 14px 40px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        footer {
            background: #dbeafe;
            text-align: center;
            padding: 22px;
        }
    </style>
</head>

<body>

    <header>
        STUDENT PORTAL
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#courses">Courses</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="welcome" id="home">
        <h2>Welcome to Student Portal</h2>

        <p>
            Access your academic details,
            manage your courses and more.
        </p>

        <a href="#login" class="login-btn">LOGIN</a>
    </section>

    <footer id="contact">
        Contact Us &nbsp; | &nbsp; About Us
    </footer>

</body>
</html>
